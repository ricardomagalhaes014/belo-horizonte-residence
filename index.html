<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Belo Horizonte Residence — Em Breve</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 520px;
    }
    .logo {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 16px;
      color: #fff;
    }
    p {
      font-size: 1rem;
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .divider {
      width: 48px;
      height: 2px;
      background: #c9a84c;
      margin: 0 auto 32px;
    }
    a.contact {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid #c9a84c;
      color: #c9a84c;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    a.contact:hover {
      background: #c9a84c;
      color: #0a0a0a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Grupo DPS &middot; Imobili&aacute;rio</div>
    <h1>Belo Horizonte Residence</h1>
    <div class="divider"></div>
    <p>Este site encontra-se temporariamente indispon&iacute;vel.<br>Para mais informa&ccedil;&otilde;es, entre em contacto connosco.</p>
    <a class="contact" href="https://dpsimobiliario.grupo-dps.com">Voltar ao Portal</a>
  </div>
</body>
</html>
